<!doctype html><html lang="en"><meta charset="utf-8"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="icon.png"><link rel="manifest" href="manifest.json"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Organiser</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f5ef;color:#263b30;font:17px system-ui,sans-serif}header{background:#294b39;color:white;padding:25px max(5vw,20px)}header h1{margin:0;font-size:30px}header p{margin:5px 0;color:#d6e5d4}nav{display:flex;flex-wrap:wrap;gap:8px;padding:16px 0}main{max-width:1000px;margin:auto;padding:0 20px 40px}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid #b7c7b5;background:#e5eddf;color:#294b39;padding:10px 15px;border-radius:9px}button.active,button.primary{background:#345b43;color:white;border-color:#345b43}button.danger{color:#984b43;background:white}section,.panel{background:white;border:1px solid #dce3d7;border-radius:16px;padding:22px;margin-bottom:16px}h2,h3{margin:0 0 12px}p{line-height:1.5}label{display:block;font-weight:600;margin:15px 0 6px}input:not([type=checkbox]),textarea,select{width:100%;padding:11px;border:1px solid #c6d0c2;border-radius:8px;background:#fbfcf9;color:inherit}textarea{min-height:90px;resize:vertical}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row input:not([type=checkbox]){flex:1;min-width:150px}.muted{color:#647467;font-size:14px}.item{border-top:1px solid #e4e9df;padding:12px 0;display:flex;gap:10px;align-items:center}.item span{flex:1;white-space:pre-wrap;overflow-wrap:anywhere}.done{text-decoration:line-through;color:#788579}input[type=checkbox]{width:21px;height:21px;accent-color:#345b43}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.grid .panel{margin:0}.pill{font-size:13px;background:#e5eddf;padding:4px 9px;border-radius:20px}footer{font-size:13px;color:#647467}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #8cae82} @media(max-width:500px){section{padding:16px}nav button{flex:1}header h1{font-size:25px}}
header{background:linear-gradient(115deg,#294b39,#52765b);padding:30px max(5vw,20px)}body{background:#f3f2eb}section,.panel{box-shadow:0 4px 18px #243c2710;border-color:#e1e5da}nav{position:sticky;top:0;background:#f3f2eb;z-index:2}h2{font-size:22px;letter-spacing:-.5px}.group{border-left:5px solid #799b76}.due{border-left-color:#b66c57}.upcoming{border-left-color:#b39a58}.item button{padding:6px 10px}.item small{display:block;color:#647467}button:hover{filter:brightness(.96)}.hero{background:#e8eee2} </style><header><h1>🪴 My Organiser</h1><p>Personal organiser · Grow at your own pace.</p></header><main><nav id="nav"></nav><section id="syncbar" style="padding:12px"><div class="row"><span id="syncstatus" role="status">Starting…</span><button id="connect" onclick="connectDropbox()">Connect Dropbox</button><button onclick="syncNow()">Sync now</button><button id="disconnect" onclick="disconnectDropbox()" hidden>Disconnect</button></div><div id="conflict"></div></section><div id="app"></div><footer>Version 3 · Local storage + optional Dropbox sync. Export backups regularly.</footer></main><script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const key='myorganiser-v3';let data={energy:'',tasks:[],projects:[],thoughts:[],focus:'',objective:'',parked:[]};try{let d=localStorage.getItem(key);if(d)data=JSON.parse(d)}catch(e){}let page='Home',current=null;const statuses=['Just an idea','Thinking','Preparing','Ready to commence','In progress','On hold','Completed'];function save(){try{localStorage.setItem(key,JSON.stringify(data));markDirty()}catch(e){alert('Browser storage unavailable. Export your data before closing.')}}function go(p){page=p;current=null;render()}function change(k,v){data[k]=v;save()}function list(arr,path){return arr.map((x,i)=>`<div class="item"><input type="checkbox" aria-label="Completed" ${x.done?'checked':''} onchange="finish('${path}',${i},${['prep','materials'].includes(path)?current:-1})"><span class="${x.done?'done':''}">${esc(x.text)}<small>${esc(x.due||'')}</small></span><button onclick="edit('${path}',${i},${['prep','materials'].includes(path)?current:-1})">Edit</button><button aria-label="Delete item" onclick="remove('${path}',${i})">×</button></div>`).join('')||'<p class="muted">Nothing here yet.</p>'}function target(path){return path==='prep'?data.projects[current].prep:path==='materials'?data.projects[current].materials:data[path]}function toggle(p,i){target(p)[i].done=!target(p)[i].done;save();render()}function remove(p,i){target(p).splice(i,1);save();render()}function add(p,id){let v=$(id).value.trim();if(!v)return;target(p).push({text:v,done:false,group:0});save();render()}function entry(p,placeholder){return `<form class="row" onsubmit="event.preventDefault();add('${p}','in-${p}')"><input id="in-${p}" aria-label="${placeholder}" placeholder="${placeholder}" required><button class="primary">Add</button></form>`}function field(k,label,placeholder=''){let p=data.projects[current];return `<label for="f-${k}">${label}</label><textarea id="f-${k}" placeholder="${placeholder}" oninput="update('${k}',this.value)">${esc(p[k])}</textarea>`}function update(k,v){data.projects[current][k]=v;save()}function newProject(){let name=$('newname').value.trim();if(!name)return;data.projects.push({name,status:'Just an idea',prep:[],materials:[],practical:'Not yet',mental:'Not yet',research:'',blocker:'',next:'',progress:'',cost:''});current=data.projects.length-1;save();render()}function openProject(i){current=i;render()}function selectOptions(a,v){return a.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}function defaults(){data.groups??=['Must do','Would like to do','When my head is ready'];data.reminders??=[];data.shopping??=[];data.notice??=7}defaults();function today(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function days(d){return Math.round((Date.parse(d+'T00:00:00Z')-Date.parse(today()+'T00:00:00Z'))/86400000)}function all(){return [...['tasks','reminders','shopping'].flatMap(k=>data[k].map((x,i)=>({x,i,k,p:-1}))),...data.projects.flatMap((p,j)=>['prep','materials'].flatMap(k=>p[k].map((x,i)=>({x,i,k,p:j}))))]}function get(k,i,p){return (p<0?data[k]:data.projects[p][k])[i]}function edit(k,i,p=-1){let x=get(k,i,p);let t=prompt('Activity name',x.text);if(t===null)return;let d=prompt('Due date (YYYY-MM-DD), blank for no date',x.due||'');if(d===null)return;if(d&&!/^\d{4}-\d{2}-\d{2}$/.test(d)){alert('Use YYYY-MM-DD');return}let n=prompt('Days of advance notice',x.notice??data.notice);if(n===null)return;x.text=t.trim()||x.text;x.due=d;x.notice=Math.max(0,Number(n)||0);if(k==='tasks'){let g=prompt(data.groups.map((a,j)=>`${j+1}: ${a}`).join('\n'),(x.group||0)+1);if(g!==null&&data.groups[Number(g)-1])x.group=Number(g)-1}if(k==='reminders'){let r=prompt('Repeat: none, daily, weekly, monthly, quarterly, yearly',x.repeat||'none');if(r!==null&&['none','daily','weekly','monthly','quarterly','yearly'].includes(r))x.repeat=r}save();render()}function finish(k,i,p){let x=get(k,i,p);if(!x.done&&x.repeat&&x.repeat!=='none'&&x.due){let d=new Date(x.due+'T12:00:00Z');let step={daily:1,weekly:7}[x.repeat];if(step)d.setUTCDate(d.getUTCDate()+step);else{let day=d.getUTCDate();d.setUTCDate(1);d.setUTCMonth(d.getUTCMonth()+({monthly:1,quarterly:3,yearly:12}[x.repeat]||1));let last=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate();d.setUTCDate(Math.min(day,last))}data.reminders.push({...x,due:d.toISOString().slice(0,10),done:false})}x.done=!x.done;save();render()}function linked(a){let {x,k,i,p}=a;return `<div class="item"><input type="checkbox" aria-label="Complete" ${x.done?'checked':''} onchange="finish('${k}',${i},${p})"><span class="${x.done?'done':''}">${esc(x.text)}<small>${x.due?esc(x.due)+' · ':''}${p>=0?esc(data.projects[p].name):k==='reminders'?'Calendar':k==='shopping'?'Lists':''}</small></span>${p>=0?`<button onclick="page='Projects';openProject(${p})">Open</button>`:''}<button onclick="edit('${k}',${i},${p})">Edit</button></div>`}function home(){let a=all().filter(a=>!a.x.done),due=a.filter(a=>a.x.due&&days(a.x.due)<=0),up=a.filter(a=>a.x.due&&days(a.x.due)>0&&days(a.x.due)<=(a.x.notice??data.notice)).sort((a,b)=>a.x.due.localeCompare(b.x.due));return `<section class="hero"><h2>My day</h2><p>${new Date().toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</p>${entry('thoughts','Quick capture — I just remembered…')}</section><section class="group due"><h2>Due today & overdue</h2>${due.map(linked).join('')||'<p class="muted">Nothing due. Enjoy the breathing space.</p>'}</section><section class="group upcoming"><h2>Coming up</h2>${up.map(linked).join('')||'<p class="muted">No upcoming reminders.</p>'}</section>${data.groups.map((g,j)=>`<section class="group"><h2>${esc(g)}</h2><form class="row" onsubmit="event.preventDefault();data.tasks.push({text:this.elements[0].value,group:${j},done:false});save();render()"><input required placeholder="Add activity"><button class="primary">Add</button></form>${a.filter(z=>z.k==='tasks'&&(z.x.group||0)===j&&!due.includes(z)&&!up.includes(z)).map(linked).join('')}</section>`).join('')}<section><h2>Pick up where I left off</h2>${data.projects.map((p,i)=>p.status==='Completed'?'':`<div class="item"><span>${esc(p.name)}<small>${esc(p.next||p.status)}</small></span><button onclick="page='Projects';openProject(${i})">Open</button></div>`).join('')}</section>`}function render(){defaults(); $('nav').innerHTML=['Home','Projects','Calendar','Lists','Brain dump','Focus','Settings','Backup'].map(p=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${p}</button>`).join('');let h='';if(page==='Home'){h=home()}if(page==='Calendar'){h=`<section><h2>Calendar & reminders</h2>${entry('reminders','Add reminder')}${list(data.reminders,'reminders')}</section>`}if(page==='Lists'){h=`<section><h2>Shopping list</h2>${entry('shopping','Add item')}${list(data.shopping,'shopping')}</section>`}if(page==='Settings'){h=`<section><h2>Personalise your organiser</h2>${data.groups.map((g,i)=>`<label>Section ${i+1}</label><input value="${esc(g)}" onchange="data.groups[${i}]=this.value;save()">`).join('')}<button onclick="data.groups.push('New section');save();render()">Add section</button><label>Default advance notice (days)</label><input type="number" min="0" value="${data.notice}" onchange="data.notice=Math.max(0,Number(this.value)||0);save()"></section><section><h2>Completed history</h2>${all().filter(a=>a.x.done).map(linked).join('')}</section>`}if(page==='Today'){h=`<section><h2>Today</h2><p class="muted">${new Date().toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</p><label>How’s your head today?</label><div class="row">${['Low energy','A few small jobs','Ready for something substantial'].map(x=>`<button class="${data.energy===x?'active':''}" onclick="change('energy','${x}');render()">${x}</button>`).join('')}</div><p>${data.energy==='Low energy'?'Preparation or rest is enough today.':data.energy==='A few small jobs'?'Choose a small, manageable next step.':data.energy?'Choose one project and protect your concentration.':'Choose how you feel, if you like.'}</p></section><section><h2>Three priorities</h2>${entry('tasks','Add a priority')}${list(data.tasks,'tasks')}<p class="muted">Unfinished items stay here until you complete or remove them.</p></section><section><h2>Pick up where I left off</h2>${data.projects.filter(p=>p.status!=='Completed').map(p=>`<div class="item"><span><strong>${esc(p.name)}</strong><br>${esc(p.next||'No next step recorded')}</span><button onclick="page='Projects';openProject(${data.projects.indexOf(p)})">Open</button></div>`).join('')||'<p>No projects yet.</p>'}</section>`}if(page==='Projects'){if(current===null){h=`<section><h2>My projects</h2><form class="row" onsubmit="event.preventDefault();newProject()"><input id="newname" placeholder="New project name" required><button class="primary">Create project</button></form></section><div class="grid">${data.projects.map((p,i)=>`<div class="panel"><span class="pill">${esc(p.status)}</span><h3 style="margin-top:12px">${esc(p.name)}</h3><p>${esc(p.next||'No next step recorded')}</p><button onclick="openProject(${i})">Open project</button></div>`).join('')}</div>`}else{let p=data.projects[current];h=`<section><button onclick="current=null;render()">← All projects</button><label>Project name</label><input value="${esc(p.name)}" oninput="update('name',this.value)"><label>Status</label><select onchange="update('status',this.value)">${selectOptions(statuses,p.status)}</select><div class="grid"><div><label>Practical readiness</label><select onchange="update('practical',this.value)">${selectOptions(['Not yet','Partially ready','Ready'],p.practical)}</select></div><div><label>Mental readiness</label><select onchange="update('mental',this.value)">${selectOptions(['Not yet','Partially ready','Ready'],p.mental)}</select></div></div></section><section><h2>Preparation is progress</h2>${entry('prep','Research or preparation task')}${list(p.prep,'prep')}<h3 style="margin-top:20px">Materials and tools</h3>${entry('materials','Item, quantity, supplier or price')}${list(p.materials,'materials')}${field('research','Research, suppliers and decisions','Links, measurements, alternatives…')}${field('cost','Budget and costs')}</section><section><h2>What is stopping me from commencing?</h2>${field('blocker','What is holding me back?','Missing information, materials, uncertainty, interruptions, mental readiness…')}<p class="muted">Is more research necessary? Is there a small reversible step? Is waiting the right choice?</p></section><section><h2>Pick up where I left off</h2>${field('progress','What have I already established or completed?')}${field('next','What is my next logical step?')}<div class="row" style="margin-top:16px"><button class="primary" onclick="change('focus',data.projects[current].name);change('objective',data.projects[current].next);go('Focus')">Focus on this project</button><button class="danger" onclick="if(confirm('Delete this project?')){data.projects.splice(current,1);current=null;save();render()}">Delete project</button></div></section>`}}if(page==='Brain dump')h=`<section><h2>Get it out of your head</h2><p>No need to organise or act on it now.</p>${entry('thoughts','Capture a thought')}${list(data.thoughts,'thoughts')}</section>`;if(page==='Focus')h=`<section><h2>Focus mode</h2><p>One project. One objective. Everything else can wait.</p><label>Current project</label><input value="${esc(data.focus)}" oninput="change('focus',this.value)"><label>Current objective</label><textarea oninput="change('objective',this.value)">${esc(data.objective)}</textarea></section><section><h2>Distraction parking area</h2>${entry('parked','Something I just remembered')}${list(data.parked,'parked')}<button onclick="data.thoughts.push(...data.parked);data.parked=[];save();render()">Move parked thoughts to Brain dump</button></section>`;if(page==='Backup')h=`<section><h2>Your information</h2><p>Export a backup to keep your information safe or manually transfer it to another device. Import replaces the current data.</p><button class="primary" onclick="backup()">Export backup</button><label>Restore from backup</label><input type="file" accept=".json" onchange="restore(this.files[0])"></section>`;$('app').innerHTML=h}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='MyOrganiser-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function restore(f){if(!f)return;try{let d=JSON.parse(await f.text());if(!['tasks','projects','thoughts','parked'].every(k=>Array.isArray(d[k]))||!d.projects.every(p=>Array.isArray(p.prep)&&Array.isArray(p.materials)))throw Error();if(confirm('Replace all current My Organiser information with this backup?')){data=d;defaults();save();render()}}catch(e){alert('Invalid My Organiser backup.')}}render();</script><script src="sync.js"></script></html>
